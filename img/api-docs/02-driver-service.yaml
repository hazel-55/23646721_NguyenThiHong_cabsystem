openapi: 3.0.3
info:
  title: CabSystem Driver Service API
  version: 1.0.0
  description: 'API quản lý hồ sơ tài xế, phương tiện, trạng thái hoạt động và vị trí.


    Dispatch Service sử dụng endpoint nội bộ `/internal/drivers/available` để lấy các tài xế phù hợp cho bước matching.'
servers:
- url: http://localhost:8080/api/v1
  description: Local API Gateway
tags:
- name: Driver Profile
  description: Hồ sơ tài xế.
- name: Vehicle
  description: Phương tiện.
- name: Availability & Location
  description: Trạng thái hoạt động và vị trí.
- name: Internal
  description: API nội bộ cho service khác.
- name: Admin
  description: Tra cứu vận hành.
paths:
  /drivers/me:
    get:
      tags:
      - Driver Profile
      summary: Xem hồ sơ tài xế hiện tại
      operationId: getMyDriverProfile
      responses:
        '200':
          description: Hồ sơ tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      description: '**Roles:** DRIVER'
    put:
      tags:
      - Driver Profile
      summary: Cập nhật hồ sơ tài xế
      operationId: updateMyDriverProfile
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverProfileRequest'
            example:
              fullName: Trần Minh Tài
              phone: 0912345678
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      description: '**Roles:** DRIVER'
  /drivers/me/vehicle:
    get:
      tags:
      - Vehicle
      summary: Xem phương tiện của tài xế
      operationId: getMyVehicle
      responses:
        '200':
          description: Thông tin phương tiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      description: '**Roles:** DRIVER'
    put:
      tags:
      - Vehicle
      summary: Tạo hoặc cập nhật phương tiện
      operationId: upsertMyVehicle
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertVehicleRequest'
            example:
              plateNumber: 51A-123.45
              vehicleType: CAR
              model: Toyota Vios
              color: Trắng
      responses:
        '200':
          description: Phương tiện đã được lưu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      description: '**Roles:** DRIVER'
  /drivers/me/status:
    patch:
      tags:
      - Availability & Location
      summary: Cập nhật trạng thái hoạt động
      operationId: updateMyDriverStatus
      description: 'Driver chủ động chuyển `AVAILABLE` hoặc `OFFLINE`. Trạng thái `BUSY` có thể được hệ thống cập nhật khi
        tài xế nhận chuyến.


        **Roles:** DRIVER'
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverStatusRequest'
            example:
              status: AVAILABLE
      responses:
        '200':
          description: Cập nhật trạng thái thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
  /drivers/me/location:
    put:
      tags:
      - Availability & Location
      summary: Cập nhật vị trí hiện tại
      operationId: updateMyLocation
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
            example:
              latitude: 10.8012
              longitude: 106.7145
      responses:
        '200':
          description: Cập nhật vị trí thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverLocation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - DRIVER
      description: '**Roles:** DRIVER'
  /internal/drivers/available:
    get:
      tags:
      - Internal
      summary: Lấy danh sách tài xế khả dụng cho Dispatch
      operationId: getAvailableDrivers
      description: 'API service-to-service. Lọc tài xế `AVAILABLE`, đúng loại xe; trả thêm khoảng cách từ điểm đón để Dispatch
        xếp hạng.


        **Roles:** SERVICE_DISPATCH'
      parameters:
      - name: vehicleType
        in: query
        required: true
        description: Loại xe cần tìm.
        schema:
          $ref: '#/components/schemas/VehicleType'
        example: CAR
      - name: pickupLatitude
        in: query
        required: true
        description: Vĩ độ điểm đón.
        schema:
          type: number
          format: double
          minimum: -90
          maximum: 90
        example: 10.8
      - name: pickupLongitude
        in: query
        required: true
        description: Kinh độ điểm đón.
        schema:
          type: number
          format: double
          minimum: -180
          maximum: 180
        example: 106.7
      responses:
        '200':
          description: Danh sách tài xế khả dụng đã sắp hoặc có dữ liệu khoảng cách.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableDriver'
              example:
              - driverId: 33333333-3333-4333-8333-333333333333
                vehicleId: 44444444-4444-4444-8444-444444444444
                vehicleType: CAR
                status: AVAILABLE
                latitude: 10.8012
                longitude: 106.7145
                distanceKm: 1.8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - SERVICE_DISPATCH
  /admin/drivers:
    get:
      tags:
      - Admin
      summary: Tra cứu danh sách tài xế
      operationId: adminGetDrivers
      parameters:
      - name: status
        in: query
        required: false
        description: Lọc trạng thái.
        schema:
          $ref: '#/components/schemas/DriverStatus'
      - name: page
        in: query
        required: false
        description: Trang.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Kích thước trang.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Danh sách tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      description: '**Roles:** ADMIN'
  /admin/drivers/{driverId}:
    get:
      tags:
      - Admin
      summary: Tra cứu tài xế theo ID
      operationId: adminGetDriver
      parameters:
      - name: driverId
        in: path
        required: true
        description: ID tài xế.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Thông tin tài xế.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      description: '**Roles:** ADMIN'
  /admin/vehicles:
    get:
      tags:
      - Admin
      summary: Tra cứu danh sách phương tiện
      operationId: adminGetVehicles
      parameters:
      - name: vehicleType
        in: query
        required: false
        description: Lọc loại xe.
        schema:
          $ref: '#/components/schemas/VehicleType'
      - name: page
        in: query
        required: false
        description: Trang.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Kích thước trang.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Danh sách phương tiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      description: '**Roles:** ADMIN'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT nhận từ Identity Service. Gửi theo dạng: Authorization: Bearer <token>.'
  schemas:
    ErrorResponse:
      type: object
      required:
      - timestamp
      - status
      - errorCode
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-14T13:00:00+07:00'
        status:
          type: integer
          example: 400
        errorCode:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        path:
          type: string
          example: /api/v1/resource
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3
    DriverStatus:
      type: string
      enum:
      - OFFLINE
      - AVAILABLE
      - BUSY
    VehicleType:
      type: string
      enum:
      - CAR
      - MOTORBIKE
    DriverProfile:
      type: object
      required:
      - id
      - userId
      - fullName
      - phone
      - status
      properties:
        id:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        userId:
          type: string
          format: uuid
          example: 22222222-2222-4222-8222-222222222222
        fullName:
          type: string
          example: Trần Minh Tài
        phone:
          type: string
          example: 0912345678
        status:
          $ref: '#/components/schemas/DriverStatus'
        updatedAt:
          type: string
          format: date-time
    UpdateDriverProfileRequest:
      type: object
      required:
      - fullName
      - phone
      properties:
        fullName:
          type: string
          example: Trần Minh Tài
        phone:
          type: string
          example: 0912345678
    Vehicle:
      type: object
      required:
      - id
      - driverId
      - plateNumber
      - vehicleType
      properties:
        id:
          type: string
          format: uuid
          example: 44444444-4444-4444-8444-444444444444
        driverId:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        plateNumber:
          type: string
          example: 51A-123.45
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        model:
          type: string
          example: Toyota Vios
        color:
          type: string
          example: Trắng
    UpsertVehicleRequest:
      type: object
      required:
      - plateNumber
      - vehicleType
      properties:
        plateNumber:
          type: string
          example: 51A-123.45
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        model:
          type: string
          example: Toyota Vios
        color:
          type: string
          example: Trắng
    UpdateDriverStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/DriverStatus'
    LocationRequest:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.8012
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.7145
    DriverLocation:
      type: object
      required:
      - driverId
      - latitude
      - longitude
      - updatedAt
      properties:
        driverId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
          example: 10.8012
        longitude:
          type: number
          format: double
          example: 106.7145
        updatedAt:
          type: string
          format: date-time
    AvailableDriver:
      type: object
      required:
      - driverId
      - vehicleId
      - vehicleType
      - status
      - latitude
      - longitude
      - distanceKm
      properties:
        driverId:
          type: string
          format: uuid
          example: 33333333-3333-4333-8333-333333333333
        vehicleId:
          type: string
          format: uuid
          example: 44444444-4444-4444-8444-444444444444
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        status:
          $ref: '#/components/schemas/DriverStatus'
        latitude:
          type: number
          format: double
          example: 10.8012
        longitude:
          type: number
          format: double
          example: 106.7145
        distanceKm:
          type: number
          format: double
          example: 1.8
    DriverPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverProfile'
        meta:
          $ref: '#/components/schemas/PageMeta'
    VehiclePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        meta:
          $ref: '#/components/schemas/PageMeta'
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 400
            errorCode: BAD_REQUEST
            message: Yêu cầu không hợp lệ.
            path: /api/v1/example
    Unauthorized:
      description: Thiếu hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 401
            errorCode: UNAUTHORIZED
            message: Thiếu hoặc JWT không hợp lệ.
            path: /api/v1/example
    Forbidden:
      description: Không có quyền thực hiện chức năng này.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 403
            errorCode: FORBIDDEN
            message: Không có quyền thực hiện chức năng này.
            path: /api/v1/example
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 404
            errorCode: NOT_FOUND
            message: Không tìm thấy tài nguyên.
            path: /api/v1/example
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 409
            errorCode: CONFLICT
            message: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
            path: /api/v1/example
    UnprocessableEntity:
      description: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 422
            errorCode: BUSINESS_RULE_VIOLATION
            message: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
            path: /api/v1/example
    InternalError:
      description: Lỗi nội bộ hệ thống.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 500
            errorCode: INTERNAL_ERROR
            message: Lỗi nội bộ hệ thống.
            path: /api/v1/example
