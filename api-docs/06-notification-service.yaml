openapi: 3.0.3
info:
  title: CabSystem Notification Service API
  version: 1.0.0
  description: 'API cho lịch sử thông báo của Customer và Driver.


    Service nhận các domain event từ RabbitMQ như `TripRequested`, `RideOfferCreated`, `DriverAssigned`, `DriverArrived`,
    `TripCompleted`, `PaymentSucceeded`, `PaymentFailed` để tạo notification.


    MVP lưu notification trong database; client có thể polling API này. Push notification/SMS/email không nằm trong scope
    bắt buộc.'
servers:
- url: http://localhost:8080/api/v1
  description: Local API Gateway
tags:
- name: Notifications
  description: Xem và đánh dấu thông báo đã đọc.
paths:
  /notifications/me:
    get:
      tags:
      - Notifications
      summary: Xem thông báo của người dùng hiện tại
      operationId: getMyNotifications
      parameters:
      - name: unreadOnly
        in: query
        required: false
        description: Chỉ lấy thông báo chưa đọc.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        description: Trang.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Kích thước trang.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Danh sách notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - DRIVER
      description: '**Roles:** CUSTOMER, DRIVER'
  /notifications/{notificationId}/read:
    patch:
      tags:
      - Notifications
      summary: Đánh dấu thông báo đã đọc
      operationId: markNotificationRead
      parameters:
      - name: notificationId
        in: path
        required: true
        description: ID notification.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Notification sau khi đánh dấu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      - DRIVER
      description: '**Roles:** CUSTOMER, DRIVER'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT nhận từ Identity Service. Gửi theo dạng: Authorization: Bearer <token>.'
  schemas:
    ErrorResponse:
      type: object
      required:
      - timestamp
      - status
      - errorCode
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-14T13:00:00+07:00'
        status:
          type: integer
          example: 400
        errorCode:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        path:
          type: string
          example: /api/v1/resource
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3
    NotificationType:
      type: string
      enum:
      - BOOKING_RECEIVED
      - RIDE_OFFER
      - DRIVER_ASSIGNED
      - DRIVER_ARRIVED
      - TRIP_COMPLETED
      - PAYMENT_SUCCEEDED
      - PAYMENT_FAILED
      - TRIP_CANCELLED
      - DISPATCH_FAILED
    Notification:
      type: object
      required:
      - id
      - userId
      - type
      - title
      - message
      - isRead
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: 99999999-9999-4999-8999-999999999999
        userId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: Đã tìm thấy tài xế
        message:
          type: string
          example: Tài xế Trần Minh Tài đã nhận chuyến của bạn.
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PageMeta'
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 400
            errorCode: BAD_REQUEST
            message: Yêu cầu không hợp lệ.
            path: /api/v1/example
    Unauthorized:
      description: Thiếu hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 401
            errorCode: UNAUTHORIZED
            message: Thiếu hoặc JWT không hợp lệ.
            path: /api/v1/example
    Forbidden:
      description: Không có quyền thực hiện chức năng này.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 403
            errorCode: FORBIDDEN
            message: Không có quyền thực hiện chức năng này.
            path: /api/v1/example
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 404
            errorCode: NOT_FOUND
            message: Không tìm thấy tài nguyên.
            path: /api/v1/example
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 409
            errorCode: CONFLICT
            message: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
            path: /api/v1/example
    UnprocessableEntity:
      description: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 422
            errorCode: BUSINESS_RULE_VIOLATION
            message: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
            path: /api/v1/example
    InternalError:
      description: Lỗi nội bộ hệ thống.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 500
            errorCode: INTERNAL_ERROR
            message: Lỗi nội bộ hệ thống.
            path: /api/v1/example
