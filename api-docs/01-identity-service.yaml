openapi: 3.0.3
info:
  title: CabSystem Identity Service API
  version: 1.0.0
  description: 'API cho Authentication, Authorization, Customer Profile và tra cứu tài khoản dành cho Admin.


    - Đăng ký tài khoản Customer/Driver.

    - Đăng nhập và phát hành JWT.

    - Quản lý hồ sơ Customer.

    - Tra cứu user/customer cho Operations/Admin.


    Các endpoint Admin yêu cầu role `ADMIN`.'
servers:
- url: http://localhost:8080/api/v1
  description: Local API Gateway
tags:
- name: Authentication
  description: Đăng ký và đăng nhập.
- name: Customer Profile
  description: Hồ sơ Customer.
- name: Admin
  description: Tra cứu vận hành dành cho Admin.
paths:
  /auth/register/customer:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản Customer
      operationId: registerCustomer
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            example:
              email: customer@example.com
              password: P@ssword123
              fullName: Nguyễn Văn An
              phone: 0901234567
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: customer@example.com
                role: CUSTOMER
                status: ACTIVE
                createdAt: '2026-09-14T13:00:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register/driver:
    post:
      tags:
      - Authentication
      summary: Đăng ký tài khoản Driver
      operationId: registerDriver
      description: Tạo account có role DRIVER. Hồ sơ tài xế và phương tiện được hoàn thiện tại Driver Service.
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDriverRequest'
            example:
              email: driver@example.com
              password: P@ssword123
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
              example:
                id: 22222222-2222-4222-8222-222222222222
                email: driver@example.com
                role: DRIVER
                status: ACTIVE
                createdAt: '2026-09-14T13:00:00+07:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: customer@example.com
              password: P@ssword123
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9...
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: customer@example.com
                  role: CUSTOMER
                  status: ACTIVE
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /customers/me:
    get:
      tags:
      - Customer Profile
      summary: Xem hồ sơ Customer hiện tại
      operationId: getMyCustomerProfile
      responses:
        '200':
          description: Thông tin hồ sơ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      description: '**Roles:** CUSTOMER'
    put:
      tags:
      - Customer Profile
      summary: Cập nhật hồ sơ Customer
      operationId: updateMyCustomerProfile
      requestBody:
        required: true
        description: Payload JSON
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerProfileRequest'
            example:
              fullName: Nguyễn Văn An
              phone: 0901234567
              avatarUrl: https://example.com/avatar-new.jpg
      responses:
        '200':
          description: Cập nhật thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - CUSTOMER
      description: '**Roles:** CUSTOMER'
  /admin/users:
    get:
      tags:
      - Admin
      summary: Tra cứu danh sách tài khoản
      operationId: adminGetUsers
      parameters:
      - name: role
        in: query
        required: false
        description: Lọc theo role.
        schema:
          $ref: '#/components/schemas/Role'
      - name: status
        in: query
        required: false
        description: Lọc theo trạng thái.
        schema:
          $ref: '#/components/schemas/AccountStatus'
      - name: page
        in: query
        required: false
        description: Trang dữ liệu.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Số phần tử mỗi trang.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Danh sách tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      description: '**Roles:** ADMIN'
  /admin/customers/{customerId}:
    get:
      tags:
      - Admin
      summary: Tra cứu Customer theo ID
      operationId: adminGetCustomer
      parameters:
      - name: customerId
        in: path
        required: true
        description: ID user của Customer.
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: Thông tin Customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-roles:
      - ADMIN
      description: '**Roles:** ADMIN'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT nhận từ Identity Service. Gửi theo dạng: Authorization: Bearer <token>.'
  schemas:
    ErrorResponse:
      type: object
      required:
      - timestamp
      - status
      - errorCode
      - message
      - path
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-09-14T13:00:00+07:00'
        status:
          type: integer
          example: 400
        errorCode:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        path:
          type: string
          example: /api/v1/resource
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3
    Role:
      type: string
      enum:
      - CUSTOMER
      - DRIVER
      - ADMIN
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - SUSPENDED
    RegisterCustomerRequest:
      type: object
      required:
      - email
      - password
      - fullName
      - phone
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssword123
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyễn Văn An
        phone:
          type: string
          example: 0901234567
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatar.jpg
    RegisterDriverRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: driver@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssword123
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: P@ssword123
    AuthResponse:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Thời gian hết hạn token tính bằng giây.
          example: 3600
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required:
      - id
      - email
      - role
      - status
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        email:
          type: string
          format: email
          example: customer@example.com
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
    CustomerProfile:
      type: object
      required:
      - userId
      - fullName
      - phone
      properties:
        userId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        email:
          type: string
          format: email
          readOnly: true
          example: customer@example.com
        fullName:
          type: string
          example: Nguyễn Văn An
        phone:
          type: string
          example: 0901234567
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatar.jpg
        updatedAt:
          type: string
          format: date-time
    UpdateCustomerProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Nguyễn Văn An
        phone:
          type: string
          example: 0901234567
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://example.com/avatar-new.jpg
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 400
            errorCode: BAD_REQUEST
            message: Yêu cầu không hợp lệ.
            path: /api/v1/example
    Unauthorized:
      description: Thiếu hoặc JWT không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 401
            errorCode: UNAUTHORIZED
            message: Thiếu hoặc JWT không hợp lệ.
            path: /api/v1/example
    Forbidden:
      description: Không có quyền thực hiện chức năng này.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 403
            errorCode: FORBIDDEN
            message: Không có quyền thực hiện chức năng này.
            path: /api/v1/example
    NotFound:
      description: Không tìm thấy tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 404
            errorCode: NOT_FOUND
            message: Không tìm thấy tài nguyên.
            path: /api/v1/example
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 409
            errorCode: CONFLICT
            message: Xung đột trạng thái hoặc dữ liệu đã tồn tại.
            path: /api/v1/example
    UnprocessableEntity:
      description: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 422
            errorCode: BUSINESS_RULE_VIOLATION
            message: Yêu cầu hợp lệ về cú pháp nhưng không thỏa quy tắc nghiệp vụ.
            path: /api/v1/example
    InternalError:
      description: Lỗi nội bộ hệ thống.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: '2026-09-14T13:00:00+07:00'
            status: 500
            errorCode: INTERNAL_ERROR
            message: Lỗi nội bộ hệ thống.
            path: /api/v1/example
